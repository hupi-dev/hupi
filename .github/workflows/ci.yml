name: CI

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: hupi
          POSTGRES_DB: hupi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # hupi_app, not the postgres superuser: row-level security
      # (schema/0005) is bypassed by table owners and superusers, so
      # connecting as postgres here would make internal/store's RLS tests
      # pass for the wrong reason — they'd never actually exercise RLS at
      # all. This is also exactly what bootstrap.go's own
      # resolveDatabaseURL doc comment already says a real deployment
      # should do.
      HUPI_ADMIN_DATABASE_URL: postgres://postgres:hupi@localhost:5432/hupi?sslmode=disable
      HUPI_TEST_DATABASE_URL: postgres://hupi_app:hupi_app_test_only@localhost:5432/hupi?sslmode=disable
      HUPI_APP_DB_PASSWORD: hupi_app_test_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      # master-test.sh is the single source of truth for "is this repo's
      # Go side green" — schema migrations, gofmt, go build, go vet, go
      # test, in that order — runnable identically here and on a
      # developer's own machine (docs/MASTER_TEST_PLAN.md). Not
      # duplicated inline here so the two can't silently drift apart.
      - name: Master test gate (migrations, gofmt, build, vet, test)
        run: ./master-test.sh

  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      # Catches an Astro syntax error, a broken import, or (as happened
      # once) a missing space around an inline link that only shows up in
      # the actually-rendered HTML — see docs/TODO.md #1.
      - run: npm run build

  # Deployment manifests are hand-edited YAML with no compiler to catch a
  # typo'd key or a broken template reference — this job is that check,
  # for deploy/helm/, deploy/k8s/, and docker-compose.yml the same way
  # the jobs above catch mistakes in Go/TS/Astro before they're only
  # found the next time someone actually tries to deploy.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "v3.20.0"

      - name: helm lint
        run: helm lint deploy/helm/hupi

      # Rendered twice — default values, and with the one flag this repo's
      # BM25 keyword search work added — so a broken template reference
      # under either setting fails here, not on a real cluster.
      - name: helm template (default values)
        run: helm template test deploy/helm/hupi > /dev/null

      - name: helm template (keyword search disabled)
        run: helm template test deploy/helm/hupi --set retrieval.enableKeywordSearch=false > /dev/null

      # kubeconform validates structure against the Kubernetes OpenAPI
      # schema entirely offline — no cluster or kubeconfig involved, unlike
      # `kubectl apply --dry-run=client`, which still reaches out to a live
      # API server for schema validation and would just fail here with no
      # cluster to reach.
      - name: Validate raw k8s manifests (kubeconform)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary deploy/k8s/*.yaml

      - name: docker compose config
        run: |
          cp .env.example .env
          # Dummy values only to satisfy compose's required-var checks —
          # this validates config syntax/interpolation, it never runs
          # anything.
          sed -i \
            -e 's/^POSTGRES_ADMIN_PASSWORD=$/POSTGRES_ADMIN_PASSWORD=ci-dummy/' \
            -e 's/^HUPI_APP_DB_PASSWORD=$/HUPI_APP_DB_PASSWORD=ci-dummy/' \
            -e 's/^HUPI_KEK=$/HUPI_KEK=ci-dummy/' \
            .env
          docker compose config > /dev/null

  # A single, stable required-status-check name covering every other job
  # — docs/MASTER_TEST_PLAN.md §4. Branch protection should point at
  # *this* job's name, not any individual one above: adding a new CI job
  # later only needs updating this job's `needs:` list, not every
  # branch-protection rule that references job names directly.
  master-test-gate:
    runs-on: ubuntu-latest
    needs: [go, vscode-extension, site, deploy]
    if: always()
    steps:
      - name: All required jobs passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required jobs did not succeed:"
            echo "${{ toJSON(needs) }}"
            exit 1
          fi
          echo "All required jobs passed."
