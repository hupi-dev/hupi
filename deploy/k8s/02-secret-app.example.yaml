# EXAMPLE ONLY — copy to 02-secret-app.yaml, fill in real values, never
# commit the real file. This is what the gateway, cron jobs, and admin
# tools actually run as: the non-owner hupi_app role (schema/0004), never
# the superuser DSN above. HUPI_KEK cannot be regenerated once data
# exists under it — back it up with the same care you'd give a password
# manager vault (INSTALL.md's warning). Add whatever api_key_env name(s)
# 00-configmap-providers.yaml's providers.yaml references (OPENAI_API_KEY
# below is just this example's default) — every key in this Secret
# becomes an env var via envFrom, so no Deployment edit is needed to add
# another provider's key.
apiVersion: v1
kind: Secret
metadata:
  name: hupi-app
type: Opaque
stringData:
  HUPI_APP_DATABASE_URL: "postgres://hupi_app:CHANGEME@your-postgres-host:5432/hupi?sslmode=require"
  HUPI_KEK: "CHANGEME-base64-32-bytes, e.g. output of: head -c32 /dev/urandom | base64"
  OPENAI_API_KEY: "CHANGEME"
