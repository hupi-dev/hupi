# EXAMPLE ONLY — copy to 01-secret-admin-db.yaml, fill in real values,
# and never commit the real file. This is the *superuser/owner* Postgres
# DSN, used only by the migrate Job (03-migrate-job.yaml) — a
# deliberately separate, higher-privilege credential from the app's own
# 02-secret-app.yaml, matching install.sh's Step 2 vs. Step 6 split and
# INSTALL.md's reasoning for why they must stay different roles.
apiVersion: v1
kind: Secret
metadata:
  name: hupi-admin-db
type: Opaque
stringData:
  HUPI_ADMIN_DATABASE_URL: "postgres://postgres:CHANGEME@your-postgres-host:5432/hupi?sslmode=require"
