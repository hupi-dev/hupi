# Weekly memory-probe self-check (ARCHITECTURE.md § Retrieval
# observability). Non-zero exit on any failed probe surfaces as a failed
# Job, so ordinary Kubernetes-native alerting on Job failures is enough —
# no extra glue needed (cmd/hupi-selfcheck/main.go's own doc comment).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hupi-selfcheck
spec:
  schedule: "0 6 * * 1" # Monday 06:00
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: selfcheck
              image: sujithsamuel/hupi:latest
              command: ["hupi-selfcheck", "/app/config/probes.yaml"]
              envFrom:
                - secretRef:
                    name: hupi-app
              volumeMounts:
                - name: providers-config
                  mountPath: /app/config/providers.yaml
                  subPath: providers.yaml
                  readOnly: true
                - name: probes-config
                  mountPath: /app/config/probes.yaml
                  subPath: probes.yaml
                  readOnly: true
              env:
                - name: HUPI_PROVIDERS_CONFIG
                  value: "/app/config/providers.yaml"
          volumes:
            - name: providers-config
              configMap:
                name: hupi-providers
            - name: probes-config
              configMap:
                name: hupi-probes
