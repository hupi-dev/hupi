{{- if .Values.secrets.adminDB.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hupi.adminDBSecretName" . }}
  labels:
    {{- include "hupi.labels" . | nindent 4 }}
type: Opaque
stringData:
  HUPI_ADMIN_DATABASE_URL: {{ .Values.secrets.adminDB.adminDatabaseURL | quote }}
{{- end }}
