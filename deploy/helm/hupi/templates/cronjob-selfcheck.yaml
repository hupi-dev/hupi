{{- if .Values.selfcheck.enabled }}
# Weekly memory-probe self-check (ARCHITECTURE.md § Retrieval
# observability). Non-zero exit on any failed probe surfaces as a failed
# Job, so ordinary Kubernetes-native alerting on Job failures is enough.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "hupi.fullname" . }}-selfcheck
  labels:
    {{- include "hupi.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.selfcheck.schedule | quote }}
  # Same reasoning as cronjob-consolidate.yaml's own comment: no benefit
  # to two overlapping runs, and K8s's own default (Allow) has no reason
  # to be relied on here either.
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: selfcheck
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["hupi-selfcheck", "/app/config/probes.yaml"]
              env:
                - name: HUPI_PROVIDERS_CONFIG
                  value: "/app/config/providers.yaml"
                - name: HUPI_ENABLE_KEYWORD_SEARCH
                  value: {{ .Values.retrieval.enableKeywordSearch | quote }}
              envFrom:
                - secretRef:
                    name: {{ include "hupi.appSecretName" . }}
              volumeMounts:
                - name: providers-config
                  mountPath: /app/config/providers.yaml
                  subPath: providers.yaml
                  readOnly: true
                - name: probes-config
                  mountPath: /app/config/probes.yaml
                  subPath: probes.yaml
                  readOnly: true
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
          volumes:
            - name: providers-config
              configMap:
                name: {{ include "hupi.fullname" . }}-providers
            - name: probes-config
              configMap:
                name: {{ include "hupi.fullname" . }}-probes
{{- end }}
