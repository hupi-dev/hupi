{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  # Fixed name (not release-revision-suffixed) plus before-hook-creation:
  # Helm deletes the previous run's Job before creating this one, so a
  # second `helm upgrade` doesn't collide with the first run's Job name.
  name: {{ include "hupi.fullname" . }}-migrate
  labels:
    {{- include "hupi.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/schema/migrate.sh"]
          envFrom:
            - secretRef:
                name: {{ include "hupi.adminDBSecretName" . }}
{{- end }}
